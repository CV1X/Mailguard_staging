<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Cargo360</title>
<link href="/vendor/fonts.css" rel="stylesheet">
<style>
:root {
  --bg:#0a0e16; --bg2:#0e131c; --bg3:#161c28; --bd:#1f2937;
  --tx:#e6edf3; --t2:#a3adba; --t3:#6b7280;
  --am:#4cc3ff; --gn:#10b981; --yw:#f59e0b; --rd:#ef4444;
  --r:8px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f1f5f9; --bg2:#ffffff; --bg3:#e8edf5; --bd:#d1d9e6;
    --tx:#0f172a; --t2:#475569; --t3:#94a3b8;
    --am:#0284c7; --gn:#059669; --yw:#d97706; --rd:#dc2626;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px; background: var(--bg); color: var(--tx);
  font-family: 'Inter', system-ui, sans-serif; font-size: 15px; min-height: 100vh;
}
.wrap { max-width: 560px; margin: 0 auto; }
.card {
  background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r);
  padding: 24px; margin-bottom: 16px;
}
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--t2); font-size: 13px; margin: 0 0 20px; }
.kpi-block { margin-bottom: 24px; }
.kpi-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.kpi-desc { font-size: 13px; color: var(--t2); margin-bottom: 10px; }
.stars { display: flex; gap: 4px; margin-bottom: 10px; }
.star {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--bd); border-radius: 6px; cursor: pointer; font-size: 20px;
  color: var(--t3); background: transparent; user-select: none; min-width: 48px; min-height: 48px;
}
.star.active { color: var(--yw); border-color: var(--yw); }
textarea {
  width: 100%; min-height: 70px; padding: 10px; border-radius: 6px; border: 1px solid var(--bd);
  background: var(--bg3); color: var(--tx); font-family: inherit; font-size: 16px; resize: vertical;
}
button.submit {
  width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: var(--r);
  border: none; background: var(--am); color: var(--bg); cursor: pointer; min-height: 48px;
}
button.submit:disabled { opacity: .5; cursor: not-allowed; }
.msg { text-align: center; padding: 40px 20px; }
.msg .icon { margin-bottom: 12px; display: flex; justify-content: center; }
.err { color: var(--rd); }
.ok { color: var(--gn); }
.google-link {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 20px; padding: 14px 20px; min-height: 48px; width: 100%;
  border-radius: var(--r); border: 1px solid var(--bd); background: var(--bg3);
  color: var(--tx); text-decoration: none; font-size: 15px; font-weight: 600;
}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card msg" id="loading">Se încarcă…</div>
</div>
<script>
(function() {
  var token = window.location.pathname.split('/f/')[1];
  var root = document.getElementById('root');
  var ratings = {};

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c) { e.appendChild(c); });
    return e;
  }

  var ICON_OK = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_ERR = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  var ICON_STAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

  function showMessage(iconSvg, title, cls, googleUrl) {
    root.innerHTML = '';
    var children = [
      el('div', { class: 'icon ' + (cls || ''), html: iconSvg }),
      el('div', { class: cls || '', text: title }),
    ];
    if (googleUrl) {
      var link = el('a', { class: 'google-link', href: googleUrl, target: '_blank', rel: 'noopener' });
      link.innerHTML = ICON_STAR + '<span>Lasă o recenzie pe Google</span>';
      children.push(link);
    }
    root.appendChild(el('div', { class: 'card msg' }, children));
  }

  function renderStars(kpi) {
    var wrap = el('div', { class: 'stars' });
    for (var i = 1; i <= kpi.scale_max; i++) {
      (function(val) {
        var s = el('div', { class: 'star', text: String(val) });
        s.addEventListener('click', function() {
          ratings[kpi.id].rating = val;
          Array.prototype.forEach.call(wrap.children, function(child, idx) {
            child.classList.toggle('active', idx < val);
          });
        });
        wrap.appendChild(s);
      })(i);
    }
    return wrap;
  }

  function renderForm(data) {
    root.innerHTML = '';
    var card = el('div', { class: 'card' });
    card.appendChild(el('h1', { text: 'Feedback' + (data.campaign_name ? ' — ' + data.campaign_name : '') }));
    card.appendChild(el('p', { class: 'sub', text: (data.client_name ? data.client_name + ', ' : '') + 'părerea ta ne ajută să fim mai buni.' }));

    if (!data.kpis || !data.kpis.length) {
      card.appendChild(el('p', { text: 'Nu există criterii de evaluat pentru această campanie.' }));
      root.appendChild(card);
      return;
    }

    data.kpis.forEach(function(kpi) {
      ratings[kpi.id] = { kpi_id: kpi.id, rating: 0, comment: '' };
      var block = el('div', { class: 'kpi-block' });
      block.appendChild(el('div', { class: 'kpi-name', text: kpi.name }));
      if (kpi.description) block.appendChild(el('div', { class: 'kpi-desc', text: kpi.description }));
      block.appendChild(renderStars(kpi));
      if (kpi.comment_enabled) {
        var ta = el('textarea', { placeholder: kpi.comment_label || 'Adaugă un comentariu (opțional)' });
        ta.addEventListener('input', function() { ratings[kpi.id].comment = ta.value; });
        block.appendChild(ta);
      }
      card.appendChild(block);
    });

    var errBox = el('div', { class: 'err', style: 'display:none; margin-bottom: 12px; font-size: 13px;' });
    card.appendChild(errBox);

    var btn = el('button', { class: 'submit', text: 'Trimite feedback' });
    btn.addEventListener('click', function() {
      var payload = { ratings: Object.keys(ratings).map(function(k) { return ratings[k]; }).filter(function(r) { return r.rating > 0; }) };
      if (!payload.ratings.length) {
        errBox.textContent = 'Selectează cel puțin o evaluare înainte de a trimite.';
        errBox.style.display = 'block';
        return;
      }
      btn.disabled = true;
      fetch('/api/v1/public/feedback/' + token, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(j) { throw new Error(j.detail || 'Eroare la trimitere'); });
        return r.json();
      }).then(function(result) {
        showMessage(ICON_OK, 'Mulțumim pentru feedback!', 'ok', result.google_review_url);
      }).catch(function(e) {
        btn.disabled = false;
        errBox.textContent = String(e.message || e);
        errBox.style.display = 'block';
      });
    });
    card.appendChild(btn);
    root.appendChild(card);
  }

  if (!token) {
    showMessage(ICON_ERR, 'Link invalid.', 'err');
    return;
  }

  fetch('/api/v1/public/feedback/' + token)
    .then(function(r) {
      if (!r.ok) return r.json().then(function(j) { throw new Error(j.detail || 'Link invalid sau expirat.'); });
      return r.json();
    })
    .then(renderForm)
    .catch(function(e) { showMessage(ICON_ERR, String(e.message || e), 'err'); });
})();
</script>
</body>
</html>
